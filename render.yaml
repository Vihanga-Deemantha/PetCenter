# Render Blueprint for the PetCenter API (Express + MongoDB Atlas).
# Dashboard: New + -> Blueprint -> pick this repo. Render creates the service
# and prompts for every `sync: false` value below — those are secrets and are
# never stored in git. The frontend is deployed separately on Vercel.
services:
  - type: web
    name: petcenter-api
    runtime: node
    rootDir: Server
    # "free" spins down after ~15 min idle (first request then takes ~50s) and
    # blocks outbound SMTP, so password-reset emails won't send. Use "starter"
    # or higher for anything real — see "Deployment" in the root README.
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Generated once by Render (random 256-bit values); must differ from each other.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d

      # Atlas connection string. Needs a replica set (Atlas always is) because
      # checkout/refund flows use multi-document transactions.
      - key: MONGODB_URI
        sync: false
      # Your Vercel production URL, e.g. https://<your-project>.vercel.app
      # (comma-separated for more than one origin; no trailing slash needed).
      - key: CLIENT_URL
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Optional features — the app degrades gracefully without them.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Password-reset email via Brevo's HTTPS API (works on Render's free tier,
      # which blocks outbound SMTP ports). EMAIL_FROM must be a sender you've
      # verified in Brevo (Senders, Domains & Dedicated IPs -> Senders).
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Plain-SMTP alternative, used only if BREVO_API_KEY is not set:
      #   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS (+ EMAIL_FROM)
